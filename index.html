<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiClock Widget</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-950 flex items-center justify-center min-h-screen font-sans text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Iconos SVG Minimalistas ---
        const IconHourglass = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M6 2h12M6 22h12M7 2v4.5a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.5V2M7 22v-4.5a2 2 0 0 1 .586-1.414L12 12l4.414 4.414A2 2 0 0 1 17 17.5V22" />
          </svg>
        );

        const IconCheck = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 10.5V12a9 9 0 1 1-5.32-8.24" /><polyline points="21 4 11 14 8 11" />
          </svg>
        );

        const IconFastForward = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <polygon points="13 18 21 12 13 6 13 18" /><polygon points="3 18 11 12 3 6 3 18" />
          </svg>
        );

        const LiquidHourglass = ({ frame, isRunning }) => {
          const totalFrames = 30;
          const progress = isRunning ? (frame % totalFrames) / totalFrames : 0.7; 
          const topHeight = Math.max(0, 8 * (1 - progress));
          const bottomHeight = Math.min(8, 8 * progress);
          const cycleCount = isRunning ? Math.floor(frame / totalFrames) : 0;
          const rotationDeg = cycleCount * 180;

          return (
            <div style={{ perspective: '300px', display: 'inline-block' }}>
              <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="26" 
                height="26" 
                viewBox="0 0 24 24" 
                fill="none"
                style={{
                  transform: `rotate(${rotationDeg}deg)`,
                  transformOrigin: 'center center',
                  transition: isRunning ? 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)' : 'none'
                }}
              >
                <path d="M6 2h12M6 22h12M7 2v4.5a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.5V2M7 22v-4.5a2 2 0 0 1 .586-1.414L12 12l4.414 4.414A2 2 0 0 1 17 17.5V22" stroke={isRunning ? "#2563eb" : "currentColor"} strokeWidth="1.5" strokeLinecap="round" />
                <g clipPath="url(#top-bulb-min)">
                  <rect x="6" y={10 - topHeight} width="12" height={topHeight} fill={isRunning ? "#2563eb" : "currentColor"} opacity={isRunning ? "0.85" : "0.6"} />
                </g>
                <g clipPath="url(#bottom-bulb-min)">
                  <rect x="6" y={22 - bottomHeight} width="12" height={bottomHeight} fill={isRunning ? "#2563eb" : "currentColor"} opacity={isRunning ? "0.85" : "0.6"} />
                </g>
                {isRunning && <line x1="12" y1="11" x2="12" y2="13" stroke="#2563eb" strokeWidth="1.5" strokeLinecap="round" />}
                <defs>
                  <clipPath id="top-bulb-min">
                    <path d="M7 2h10l-3 4.5a2 2 0 0 1-.586 1.414L12 12l-1.414-4.086A2 2 0 0 1 10 6.5L7 2z" />
                  </clipPath>
                  <clipPath id="bottom-bulb-min">
                    <path d="M7 22h10l-3-4.5a2 2 0 0 0-.586-1.414L12 12l-1.414 4.086A2 2 0 0 0 10 17.5L7 22z" />
                  </clipPath>
                </defs>
              </svg>
            </div>
          );
        };

        const LiquidBattery = ({ frame }) => {
          return (
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none">
              <rect x="6" y="5" width="12" height="16" rx="2.5" stroke="currentColor" strokeWidth="1.5" />
              <path d="M10 3h4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
              <g clipPath="url(#battery-clip-min)">
                <path d={`M 4 ${14 + Math.sin(frame * 0.5) * 1.5} Q 10 ${12 + Math.cos(frame * 0.5) * 1.5} 20 ${14 + Math.sin(frame * 0.5) * 1.5} L 20 22 L 4 22 Z`} fill="currentColor" opacity="0.25" />
                <path d={`M 4 ${16 + Math.cos(frame * 0.5) * 1.5} Q 10 ${14 + Math.sin(frame * 0.5) * 1.5} 20 ${16 + Math.cos(frame * 0.5) * 1.5} L 20 22 L 4 22 Z`} fill="currentColor" opacity="0.55" />
              </g>
              <defs>
                <clipPath id="battery-clip-min">
                  <rect x="7" y="6" width="10" height="14" rx="1.5" />
                </clipPath>
              </defs>
            </svg>
          );
        };

        const IconRefresh = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><polyline points="3 3 3 8 8 8" />
          </svg>
        );

        const IconTrash = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        );

        const IconPlus = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        );

        function App() {
          const [view, setView] = useState('menu');
          const [selectedTool, setSelectedTool] = useState(null); 
          const [isTransitioning, setIsTransitioning] = useState(false);
          const [clickPosition, setClickPosition] = useState(null);
          
          // Cronómetro
          const [time, setTime] = useState(0);
          const [isRunning, setIsRunning] = useState(false);
          const [hourglassFrame, setHourglassFrame] = useState(0);
          const timerRef = useRef(null);

          useEffect(() => {
            let frameInterval = null;
            if (isRunning) {
              timerRef.current = setInterval(() => { setTime((prev) => prev + 10); }, 10);
              frameInterval = setInterval(() => { setHourglassFrame(prev => (prev + 1) % 30); }, 100);
            } else {
              clearInterval(timerRef.current);
              clearInterval(frameInterval);
            }
            return () => { clearInterval(timerRef.current); clearInterval(frameInterval); };
          }, [isRunning]);

          const formatTime = (timeInMs) => {
            const minutes = Math.floor(timeInMs / 60000);
            const seconds = Math.floor((timeInMs % 60000) / 1000);
            const centiseconds = Math.floor((timeInMs % 1000) / 10);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
          };

          const resetStopwatch = () => { setIsRunning(false); setTime(0); };

          const clickTimeout = useRef(null);
          const longPressTimeout = useRef(null);
          const isLongPress = useRef(false);

          const handleStopwatchPointerDown = () => {
            isLongPress.current = false;
            longPressTimeout.current = setTimeout(() => { isLongPress.current = true; returnToMenu(); }, 600);
          };

          const handleStopwatchPointerUp = () => {
            clearTimeout(longPressTimeout.current);
            if (isLongPress.current) return;
            if (clickTimeout.current) {
              clearTimeout(clickTimeout.current);
              clickTimeout.current = null;
              setIsRunning(false);
            } else {
              clickTimeout.current = setTimeout(() => { setIsRunning(true); clickTimeout.current = null; }, 250);
            }
          };

          // Cosas por hacer
          const [habits, setHabits] = useState([]);
          const [newHabitText, setNewHabitText] = useState('');
          const [isAddingHabit, setIsAddingHabit] = useState(false);

          const toggleHabit = (id) => {
            setHabits(habits.map(h => h.id === id ? { ...h, completed: !h.completed } : h));
          };

          const clearHabits = () => { setHabits([]); };

          const addHabit = (e) => {
            e.preventDefault();
            if (newHabitText.trim() !== '') {
              setHabits([...habits, { id: Date.now(), text: newHabitText, completed: false }]);
              setNewHabitText('');
              setIsAddingHabit(false);
            }
          };

          // Cuenta Días
          const [startDate, setStartDate] = useState(null);
          const [daysRunning, setDaysRunning] = useState(false);
          const [elapsedTime, setElapsedTime] = useState(0);
          const [batteryFrame, setBatteryFrame] = useState(0);
          const [objectiveName, setObjectiveName] = useState('Mi Objetivo');
          const [isEditingObjective, setIsEditingObjective] = useState(false);
          const [tempObjective, setTempObjective] = useState('');

          useEffect(() => {
            let interval = null;
            let frameInterval = null;
            if (daysRunning && startDate) {
              interval = setInterval(() => { setElapsedTime(Date.now() - startDate); }, 1000);
              frameInterval = setInterval(() => { setBatteryFrame(prev => (prev + 1) % 30); }, 100);
            } else {
              clearInterval(interval);
              clearInterval(frameInterval);
            }
            return () => { clearInterval(interval); clearInterval(frameInterval); };
          }, [daysRunning, startDate]);
          
          const daysPassed = Math.floor(elapsedTime / (1000 * 60 * 60 * 24));
          const hoursPassed = Math.floor((elapsedTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutesPassed = Math.floor((elapsedTime % (1000 * 60 * 60)) / (1000 * 60));
          const secondsPassed = Math.floor((elapsedTime % (1000 * 60)) / 1000);

          const rebootDays = () => { setDaysRunning(false); setStartDate(null); setElapsedTime(0); };

          const handleSaveObjective = (e) => {
            e.preventDefault();
            if (tempObjective.trim() !== '') { setObjectiveName(tempObjective); }
            setIsEditingObjective(false);
          };

          const daysLongPressTimeout = useRef(null);
          const daysIsLongPress = useRef(false);
          const daysClickTimeout = useRef(null);

          const handleDaysPointerDown = () => {
            daysIsLongPress.current = false;
            daysLongPressTimeout.current = setTimeout(() => { daysIsLongPress.current = true; returnToMenu(); }, 600);
          };

          const handleDaysPointerUp = () => {
            clearTimeout(daysLongPressTimeout.current);
            if (daysIsLongPress.current) return;
            if (daysClickTimeout.current) {
              clearTimeout(daysClickTimeout.current);
              daysClickTimeout.current = null;
              setDaysRunning(false);
            } else {
              daysClickTimeout.current = setTimeout(() => {
                if (!daysRunning) { setStartDate(Date.now()); setDaysRunning(true); }
                daysClickTimeout.current = null;
              }, 250);
            }
          };

          const handleSelectTool = (tool, position) => {
            setSelectedTool(tool);
            setClickPosition(position);
            setIsTransitioning(true);
            setTimeout(() => {
              setView(tool);
              setIsTransitioning(false);
              setSelectedTool(null);
              setClickPosition(null);
            }, 700);
          };

          const returnToMenu = () => {
            setIsTransitioning(true);
            setTimeout(() => {
              setView('menu');
              setSelectedTool(null);
              setClickPosition(null);
              setIsTransitioning(false);
            }, 600);
          };

          return (
            <div className="min-h-screen bg-gray-950 flex items-center justify-center p-4 font-sans text-gray-800">
              <div className="relative w-full max-w-sm h-[600px] bg-gray-100 rounded-[2.5rem] shadow-2xl border-[8px] border-gray-800 overflow-hidden flex flex-col items-center justify-center p-6">
                
                <h1 className="absolute top-8 text-xl font-bold text-gray-400 tracking-wider font-mono">MultiClock</h1>

                {view === 'menu' && (
                  <div className={`bg-white/90 backdrop-blur-md p-3 rounded-full shadow-lg flex gap-4 items-center border border-gray-200 transition-all duration-700 ease-in-out ${isTransitioning ? 'opacity-0 scale-95' : 'opacity-100 scale-100'}`}>
                    <button onClick={() => handleSelectTool('stopwatch', 'left')} className="p-4 rounded-full bg-blue-100 text-blue-600 hover:bg-blue-200 shadow-sm cursor-pointer transition-all">
                      <IconHourglass />
                    </button>
                    <button onClick={() => handleSelectTool('habits', 'center')} className="p-4 rounded-full bg-emerald-100 text-emerald-600 hover:bg-emerald-200 shadow-sm cursor-pointer transition-all">
                      <IconCheck />
                    </button>
                    <button onClick={() => handleSelectTool('days', 'right')} className="p-4 rounded-full bg-purple-100 text-purple-600 hover:bg-purple-200 shadow-sm cursor-pointer transition-all">
                      <IconFastForward />
                    </button>
                  </div>
                )}

                {view === 'stopwatch' && (
                  <div className="bg-white shadow-xl rounded-full px-6 py-4 flex items-center justify-between w-full border border-gray-100 animate-in fade-in zoom-in duration-300">
                    <div 
                      className={`cursor-pointer select-none p-2 rounded-full hover:bg-gray-100 transition-colors ${isRunning ? 'text-blue-600 scale-110' : 'text-gray-400'}`}
                      onPointerDown={handleStopwatchPointerDown}
                      onPointerUp={handleStopwatchPointerUp}
                      onPointerLeave={() => clearTimeout(longPressTimeout.current)}
                    >
                      <LiquidHourglass frame={hourglassFrame} isRunning={isRunning} />
                    </div>
                    <div className="flex-1 text-center py-2">
                      <div className="text-2xl font-mono font-semibold tracking-tight text-gray-800 tabular-nums">
                        {formatTime(time).split('.')[0]}
                        <span className="text-lg text-gray-400">.{formatTime(time).split('.')[1]}</span>
                      </div>
                      <div className="text-[0.6rem] text-gray-400 uppercase tracking-widest mt-0.5">
                        {isRunning ? 'Corriendo' : 'Pausado'}
                      </div>
                    </div>
                    <button onClick={resetStopwatch} className="text-gray-400 hover:text-red-500 transition-colors p-1 cursor-pointer">
                      <IconRefresh />
                    </button>
                  </div>
                )}

                {view === 'habits' && (
                  <div className="bg-white/95 shadow-xl rounded-[2rem] w-full h-[320px] flex flex-col border border-gray-100 animate-in fade-in zoom-in duration-300 overflow-hidden font-light tracking-wide">
                    <div className="bg-emerald-50/70 px-4 py-3.5 border-b border-emerald-100/50 flex justify-between items-center">
                      <button onClick={returnToMenu} className="text-emerald-700 hover:text-emerald-900 bg-white p-2 rounded-full shadow-xs cursor-pointer">
                        <IconCheck />
                      </button>
                      <span className="font-medium text-emerald-900 text-sm tracking-tight">Cosas por hacer</span>
                      <button onClick={() => setIsAddingHabit(!isAddingHabit)} className="text-emerald-700 hover:bg-emerald-100/80 p-2 rounded-full cursor-pointer">
                        <IconPlus />
                      </button>
                    </div>

                    {isAddingHabit && (
                      <form onSubmit={addHabit} className="p-3 border-b border-gray-100 bg-gray-50/80 flex gap-2">
                        <input 
                          type="text" 
                          autoFocus
                          placeholder="Nueva tarea..." 
                          value={newHabitText}
                          onChange={(e) => setNewHabitText(e.target.value)}
                          className="flex-1 px-3 py-1.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-400 text-xs bg-white text-gray-700 font-light"
                        />
                        <button type="submit" className="bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-medium cursor-pointer shadow-xs">Añadir</button>
                      </form>
                    )}

                    <div className="flex-1 overflow-y-auto p-4 space-y-3">
                      {habits.length === 0 ? (
                        <div className="h-full flex items-center justify-center text-gray-400 text-xs text-center px-4 font-light">
                          No hay cosas por hacer. Presiona el botón [+] para agregar una nueva.
                        </div>
                      ) : (
                        habits.map(habit => (
                          <div key={habit.id} className="flex items-center gap-3 group cursor-pointer py-1" onClick={() => toggleHabit(habit.id)}>
                            <div className={`w-4 h-4 rounded-full border flex items-center justify-center transition-all ${habit.completed ? 'bg-emerald-500 border-emerald-500' : 'border-gray-300 group-hover:border-emerald-400'}`}>
                              {habit.completed && <svg className="w-2.5 h-2.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>}
                            </div>
                            <span className={`flex-1 transition-all text-xs font-light ${habit.completed ? 'text-gray-400 line-through' : 'text-gray-700'}`}>
                              {habit.text}
                            </span>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="p-3 bg-gray-50/50 border-t border-gray-100/80 flex justify-start">
                      <button onClick={clearHabits} className="flex items-center gap-1.5 text-gray-400 hover:text-red-500 text-xs font-light transition-colors cursor-pointer">
                        <IconTrash /> Limpiar
                      </button>
                    </div>
                  </div>
                )}

                {view === 'days' && (
                  <div className="bg-white shadow-xl rounded-[2rem] px-6 py-5 flex items-center justify-between w-full border border-gray-100 animate-in fade-in zoom-in duration-300 relative">
                    <div 
                      className={`text-gray-400 cursor-pointer select-none p-2 rounded-full hover:bg-gray-100 transition-colors ${daysRunning ? 'text-purple-600 scale-110' : ''}`}
                      onPointerDown={handleDaysPointerDown}
                      onPointerUp={handleDaysPointerUp}
                      onPointerLeave={() => clearTimeout(daysLongPressTimeout.current)}
                    >
                      {daysRunning ? <LiquidBattery frame={batteryFrame} /> : <IconFastForward />}
                    </div>
                    
                    <div className="flex-1 text-center py-1 px-2">
                      {isEditingObjective ? (
                        <form onSubmit={handleSaveObjective} className="flex flex-col items-center mb-1">
                          <input 
                            type="text" 
                            autoFocus
                            value={tempObjective}
                            onChange={(e) => setTempObjective(e.target.value)}
                            placeholder="Nombre objetivo..." 
                            className="text-xs text-center border border-purple-300 rounded px-2 py-0.5 w-full focus:outline-none focus:border-purple-500 mb-1"
                          />
                          <button type="submit" className="text-[0.6rem] bg-purple-600 text-white px-2 py-0.5 rounded">Guardar</button>
                        </form>
                      ) : (
                        <div className="text-xs font-semibold text-purple-600 truncate max-w-[140px] mx-auto mb-0.5">
                          {objectiveName}
                        </div>
                      )}

                      <div className="text-xl font-bold text-gray-800">
                        {daysPassed} <span className="text-sm text-gray-500 font-normal">días</span>
                      </div>
                      <div className="text-[0.65rem] text-gray-500 font-mono tracking-tight mt-0.5">
                        {daysRunning 
                          ? `${hoursPassed.toString().padStart(2, '0')}h ${minutesPassed.toString().padStart(2, '0')}m ${secondsPassed.toString().padStart(2, '0')}s` 
                          : 'Toque icono para iniciar'}
                      </div>
                    </div>

                    <div className="flex flex-col items-center justify-center gap-2">
                      <button onClick={() => { setTempObjective(objectiveName); setIsEditingObjective(!isEditingObjective); }} className="text-purple-500 hover:text-purple-700 bg-purple-50 hover:bg-purple-100 p-1.5 rounded-full transition-colors cursor-pointer">
                        <IconPlus />
                      </button>
                      <button onClick={rebootDays} className="text-gray-400 hover:text-orange-500 transition-colors p-1.5 rounded-full cursor-pointer">
                        <IconRefresh />
                      </button>
                    </div>
                  </div>
                )}

              </div>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
